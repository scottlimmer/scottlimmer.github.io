<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <sidebar>
    {{ partial "sidebar.html" . }}
  </sidebar>

  {{ $mainClass := "" }}
  {{ if (eq .Kind "home") }}
    {{ $mainClass = "home" }}
  {{ end }}
  <main class="{{ $mainClass }}">
    <article>
      {{ block "main" . }}{{ end }}
    </article>
    <footer>
      {{ partial "footer.html" . }}
    </footer>
  </main>

</body>
</html>
